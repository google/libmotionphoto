name: Build and Test (Linux & macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, deps=${{ matrix.deps_mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        deps_mode: [system, fetchcontent]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu - system deps)
        if: runner.os == 'Linux' && matrix.deps_mode == 'system'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libprotobuf-dev protobuf-compiler libabsl-dev libheif-dev pkg-config

      - name: Install dependencies (Ubuntu - fetchcontent mode)
        if: runner.os == 'Linux' && matrix.deps_mode == 'fetchcontent'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libprotobuf-dev protobuf-compiler libabsl-dev pkg-config

      - name: Install dependencies (macOS - system deps)
        if: runner.os == 'macOS' && matrix.deps_mode == 'system'
        run: |
          brew update
          brew install cmake protobuf abseil libheif pkg-config

      - name: Install dependencies (macOS - fetchcontent mode)
        if: runner.os == 'macOS' && matrix.deps_mode == 'fetchcontent'
        run: |
          brew update
          brew install cmake protobuf abseil pkg-config

      - name: Run Build
        run: |
          chmod +x build.sh test.sh
          if [ "${{ matrix.deps_mode }}" = "fetchcontent" ]; then
            ./build.sh -DLIBMOTIONPHOTO_USE_SYSTEM_DEPS=OFF -DLIBMOTIONPHOTO_DOWNLOAD_DEPS=ON
          else
            ./build.sh -DLIBMOTIONPHOTO_USE_SYSTEM_DEPS=ON
          fi

      - name: Run Unit Tests
        run: |
          ./test.sh
