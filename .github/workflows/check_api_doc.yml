name: Java API Doc Sync Check

on:
  pull_request:
    paths:
      - 'java/com/google/libmotionphoto/motionphoto/**'
      - 'java/java_api_description.md'

jobs:
  check-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run API doc check script
        run: |
          chmod +x tools/check_api_doc.sh
          ./tools/check_api_doc.sh
