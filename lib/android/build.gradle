plugins {
    id 'com.android.library'
}

android {
    namespace 'com.google.libmotionphoto.android'
    compileSdk 34
    buildToolsVersion "35.0.0"
    ndkVersion "26.1.10909125"

    buildFeatures {
        aidl true
    }

    defaultConfig {
        minSdk 26
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a"
                arguments "-DANDROID_STL=c++_static",
                          "-DCMAKE_CXX_FLAGS=-Wno-invalid-offsetof -Wno-unknown-pragmas -Wno-error",
                          "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384",
                          "-DWITH_GDK_PIXBUF=OFF",
                          "-DWITH_EXAMPLES=OFF",
                          "-DBUILD_TESTING=OFF",
                          "-DCMAKE_FIND_ROOT_PATH=" + rootProject.projectDir.absolutePath + "/external/install_arm64-v8a",
                          "-DCMAKE_PREFIX_PATH=" + rootProject.projectDir.absolutePath + "/external/install_arm64-v8a",
                          "-DHOST_PROTOC_EXECUTABLE=" + rootProject.projectDir.absolutePath + "/external/install_host/bin/protoc"
            }
        }
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java']
            }
            aidl {
                srcDirs = ['src/main/aidl']
            }
        }
        androidTest {
            assets {
                srcDirs = ['../core/motion_photo/testdata']
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED',
                        '--add-opens=java.base/java.lang=ALL-UNNAMED',
                        '--add-opens=java.base/java.util=ALL-UNNAMED',
                        '--add-opens=java.base/java.net=ALL-UNNAMED'
                def jniBuildDir = new File(rootDir, "../../build/lib/core").absolutePath
                def rootBuildDir = new File(rootDir, "../../build").absolutePath
                systemProperty "java.library.path",
                    jniBuildDir + File.pathSeparator +
                    rootBuildDir + File.pathSeparator +
                    System.getProperty("java.library.path", "")
            }
        }
    }
}

dependencies {
    api project(':lib:java')
    api 'com.google.protobuf:protobuf-javalite:3.25.1'
    implementation 'androidx.annotation:annotation:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'org.ow2.asm:asm:9.8'
    testImplementation 'org.ow2.asm:asm-commons:9.8'
    testImplementation 'org.ow2.asm:asm-tree:9.8'
    testImplementation 'org.ow2.asm:asm-util:9.8'
    testImplementation 'org.ow2.asm:asm-analysis:9.8'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
