plugins {
    id 'com.android.library'
}

android {
    namespace 'com.google.libmotionphoto.android'
    compileSdk 34
    buildToolsVersion "35.0.0"
    ndkVersion "26.1.10909125"

    buildFeatures {
        aidl true
    }

    defaultConfig {
        minSdk 26
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            cmake {
                abiFilters "arm64-v8a"
                arguments "-DANDROID_STL=c++_static",
                          "-DCMAKE_CXX_FLAGS=-Wno-invalid-offsetof -Wno-unknown-pragmas -Wno-error",
                          "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384",
                          "-DWITH_GDK_PIXBUF=OFF",
                          "-DWITH_EXAMPLES=OFF",
                          "-DBUILD_TESTING=OFF",
                          "-DCMAKE_FIND_ROOT_PATH=" + rootProject.projectDir.absolutePath + "/external/install_arm64-v8a",
                          "-DCMAKE_PREFIX_PATH=" + rootProject.projectDir.absolutePath + "/external/install_arm64-v8a",
                          "-DHOST_PROTOC_EXECUTABLE=" + rootProject.projectDir.absolutePath + "/external/install_host/bin/protoc"
            }
        }
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java']
            }
            aidl {
                srcDirs = ['src/main/aidl']
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    api project(':lib:java')
    implementation 'androidx.annotation:annotation:1.7.1'
}
