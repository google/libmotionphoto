syntax = "proto3";

package libmotionphoto.motion_photo;

option java_multiple_files = true;
option java_package = "com.google.libmotionphoto.motionphoto.proto";
option optimize_for = LITE_RUNTIME;

// Metadata for Apple QuickTime Live Photo (.mov) Timed Metadata
// ("com.apple.quicktime.still-image-time").
message AppleLivePhotoMetadata {
  // True if the QuickTime "mebx" timed metadata track with key
  // "com.apple.quicktime.still-image-time" is present.
  bool has_still_image_time_track = 1;

  // Still-image presentation timestamp in microseconds within the Live Photo
  // video timeline, or -1 if absent.
  int64 primary_image_timestamp_us = 2;

  // Movie header (mvhd) timescale in ticks per second.
  uint32 movie_timescale = 3;

  // Byte offset of the video stream relative to the start of the block.
  uint64 video_offset = 4;

  // Byte length of the video stream.
  uint64 video_length = 5;
}
