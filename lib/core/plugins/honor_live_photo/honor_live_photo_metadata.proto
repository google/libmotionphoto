syntax = "proto3";

package libmotionphoto.motion_photo;

option java_multiple_files = true;
option java_package = "com.google.libmotionphoto.motionphoto.proto";
option optimize_for = LITE_RUNTIME;

// Metadata for Honor / Huawei Moving Picture ("HiHonor_*", "LivePhoto_*",
// and "LIVE_<size>" trailer formats).
message HonorLivePhotoMetadata {
  // Trailer format variant ("hihonor_tlv", "livephoto_tlv", or "live_footer").
  string format_variant = 1;

  // True if an embedded MP4 video stream was found in the trailer.
  bool has_embedded_video = 2;

  // Byte offset of the embedded MP4 stream relative to the start of the
  // trailer block.
  uint64 video_offset = 3;

  // Byte length of the embedded MP4 stream.
  uint64 video_length = 4;

  // Camera sceneMode parsed from HiHonor_OfflineData JSON (e.g., 73 for
  // Moving Photo mode), or 0 if absent.
  int32 scene_mode = 5;

  // Presentation / cover frame timestamp in microseconds, if present.
  int64 primary_image_timestamp_us = 6;

  // Backward-linked 20-byte TLV tags discovered in the trailer (ordered from
  // EOF backward).
  repeated string tlv_tags = 7;
}
