syntax = "proto3";

package libmotionphoto.motion_photo;

option java_multiple_files = true;
option java_package = "com.google.libmotionphoto.motionphoto.proto";
option optimize_for = LITE_RUNTIME;

// Metadata for OPPO / OnePlus / realme "O Live Photo" (OpCamera / jxrs).
message OplusOliveMetadata {
  // OpCamera:OLivePhotoVersion parsed from XMP or jxrs footer (e.g., 1 or 2).
  int32 olive_photo_version = 1;

  // True if the 68-byte "jxrs" integrity footer is present at the end of the
  // trailer.
  bool has_jxrs_footer = 2;

  // Version field stored in the last 4 bytes after "jxrs" in the trailer.
  uint32 jxrs_footer_version = 3;

  // 60-byte ASCII hex digest stored immediately before "jxrs" in the 68-byte
  // footer.
  string jxrs_checksum_hex = 4;

  // Byte offset of the embedded MP4 stream relative to the start of the
  // trailer block.
  uint64 video_offset = 5;

  // Exact byte length of the embedded MP4 stream (excluding the 68-byte jxrs
  // footer when present).
  uint64 video_length = 6;

  // Presentation timestamp in microseconds from XMP, if present.
  int64 primary_image_timestamp_us = 7;
}
