syntax = "proto3";

package libmotionphoto.motion_photo;

option java_multiple_files = true;
option java_package = "com.google.libmotionphoto.motionphoto.proto";
option optimize_for = LITE_RUNTIME;

// Metadata for Samsung Extended Format (SEF) Motion Photos (JPEG and HEIC).
message SamsungSefMetadata {
  // SEF format version parsed from the SEFH directory header (e.g., 106, 107).
  uint32 sef_version = 1;

  // Number of SEF directory entries in the SEFH table.
  uint32 sef_entry_count = 2;

  // True if a MotionPhoto_Data (type 0x0A30) entry or mpv2/mpv3 header was
  // found in the SEF directory or HEIC container.
  bool has_motion_photo_data = 3;

  // MotionPhoto_Data payload magic ("mpv2", "mpv3", or empty for raw MP4).
  string motion_photo_data_magic = 4;

  // Byte offset of the embedded MP4 stream relative to the start of the block
  // (for JPEG trailer) or file (for HEIC mpvd).
  uint64 video_offset = 5;

  // Byte length of the embedded MP4 stream.
  uint64 video_length = 6;

  // Presentation timestamp in microseconds parsed from associated XMP, if any.
  int64 primary_image_timestamp_us = 7;

  // SEF record keys discovered in the trailer/sefd directory.
  repeated string sef_keys = 8;
}
